<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지도 시안</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Maplestory;font-weight:400;src:url(fonts/Maplestory_Light.woff2) format('woff2')}
@font-face{font-family:Maplestory;font-weight:700;src:url(fonts/Maplestory_Bold.woff2) format('woff2')}
:root{--ink:#4A2D5E;--peach:#FF9C7E;--butter:#FFE6A8;--lav:#C9B8FF;--bg:#FFF4EC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Maplestory,sans-serif;padding:18px 16px 40px}
h1{font:700 44px/.8 Dongle,sans-serif;margin:0 0 4px}
p{margin:0 0 14px;font-size:13px;opacity:.8}
.days{display:flex;gap:8px;margin-bottom:14px}
.days button{flex:1;border:0;border-radius:18px;min-height:44px;font:700 26px/.9 Dongle,sans-serif;color:var(--ink);background:radial-gradient(circle at 30% 22%,#fff,#FFF3EC 60%,#F6DED2);box-shadow:0 6px 0 #EAD2C6,inset -4px -6px 10px rgba(74,45,94,.12),inset 4px 6px 10px rgba(255,255,255,.85);cursor:pointer}
.days button[aria-pressed=true]{background:radial-gradient(circle at 30% 22%,#FFD3C4,var(--peach) 58%,#F07C5D);color:#fff;box-shadow:0 6px 0 #D96A4D,inset 4px 6px 10px rgba(255,255,255,.5)}
.frame{border-radius:32px;padding:10px;background:radial-gradient(circle at 30% 20%,#FFF8DC,var(--butter) 55%,#F7D88E);box-shadow:0 10px 0 #E3BE66,0 18px 26px rgba(74,45,94,.16),inset -6px -9px 16px rgba(74,45,94,.15),inset 7px 9px 14px rgba(255,255,255,.85)}
#map{height:440px;border-radius:24px;overflow:hidden;background:#F4EFE9}
.leaflet-container{font-family:Maplestory,sans-serif}
.pin{position:relative}
.pin b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:700 22px/1 Dongle,sans-serif;background:radial-gradient(circle at 32% 28%,#F1ECFF,#C9B8FF 55%,#9A84E4);box-shadow:0 4px 6px rgba(74,45,94,.35),inset 2px 2px 4px rgba(255,255,255,.7);text-shadow:0 1px 0 #8C74D6}
.pin.first b{background:radial-gradient(circle at 32% 28%,#FFE1D6,#FF9C7E 55%,#E06F52);text-shadow:0 1px 0 #D96A4D}
.pin span{position:absolute;left:34px;top:5px;white-space:nowrap;font-size:12px;font-weight:700;background:rgba(255,255,255,.92);padding:1px 8px;border-radius:999px;box-shadow:0 2px 4px rgba(74,45,94,.18)}
.note{font-size:12px;margin-top:22px;opacity:.75}
</style></head><body>
<h1>지도 시안</h1>
<p>글자 없는 지도 위에 우리 장소만 한글로 표시했어요. 한 손가락으로 움직이고, 두 손가락으로 확대해 보세요.</p>
<div class="days" id="days"></div>
<div class="frame"><div id="map"></div></div>
<p class="note">지도 © OpenStreetMap 기여자, © CARTO · 시안용 페이지예요. 앱에는 아직 적용되지 않았어요.</p>
<script src="lib/leaflet.js"></script>
<script>
{
const DAYS=[{"start": "10:30", "mode": "car", "fixEnd": true, "stops": [{"name": "고마쓰 공항 도착", "lat": 36.3946, "lng": 136.4065, "stay": 40, "cost": 0, "memo": "입국 심사·짐 찾기 시간 포함"}, {"name": "나타데라(那谷寺)", "lat": 36.3299, "lng": 136.4212, "stay": 90, "cost": 1000, "memo": "1월 1일이라 참배객이 많을 수 있음 · 입장료 확인 필요"}, {"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": "숙소가 정해지면 좌표를 바꿔 주세요"}]}, {"start": "09:00", "mode": "transit", "fixEnd": true, "stops": [{"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": ""}, {"name": "가나자와역", "lat": 36.5781, "lng": 136.6478, "stay": 15, "cost": 0, "memo": "고마쓰↔가나자와 기차표는 경비에 추가"}, {"name": "오미초 시장", "lat": 36.5716, "lng": 136.6566, "stay": 60, "cost": 3000, "memo": "정월 연휴 휴무 여부 확인 필요"}, {"name": "겐로쿠엔", "lat": 36.5621, "lng": 136.6627, "stay": 90, "cost": 320, "memo": "입장료 확인 필요"}, {"name": "가나자와 21세기 미술관", "lat": 36.561, "lng": 136.6583, "stay": 60, "cost": 0, "memo": "무료 구역 기준 · 연말연시 휴관 확인"}, {"name": "히가시차야 거리", "lat": 36.5725, "lng": 136.6668, "stay": 60, "cost": 0, "memo": ""}, {"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": ""}]}, {"start": "09:30", "mode": "car", "fixEnd": true, "stops": [{"name": "숙소 체크아웃", "lat": 36.4026, "lng": 136.4533, "stay": 30, "cost": 0, "memo": ""}, {"name": "고마쓰역 주변 점심", "lat": 36.4031, "lng": 136.4545, "stay": 60, "cost": 2500, "memo": ""}, {"name": "고마쓰 공항 출발", "lat": 36.3946, "lng": 136.4065, "stay": 0, "cost": 0, "memo": "보통 국제선은 2시간 전 도착 권장"}]}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map',{zoomControl:false,attributionControl:true,dragging:true,tap:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
let layer=L.layerGroup().addTo(map);
function show(d){
  layer.clearLayers();
  const st=DAYS[d].stops.filter(s=>typeof s.lat==='number');
  const pts=st.map(s=>[s.lat,s.lng]);
  if(pts.length>1){L.polyline(pts,{color:'#E9A48C',weight:10,opacity:.9,lineCap:'round'}).addTo(layer);L.polyline(pts,{color:'#fff',weight:3,opacity:.9,dashArray:'1 10'}).addTo(layer)}
  const seen={};
  st.forEach((s,i)=>{const k=s.lat.toFixed(4)+','+s.lng.toFixed(4);if(seen[k]!==undefined){seen[k]+=1}else seen[k]=0;
    const icon=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div class="pin${i===0?' first':''}"><b>${i+1}</b>${seen[k]?'':`<span>${esc(s.name)}</span>`}</div>`});
    L.marker([s.lat,s.lng],{icon}).addTo(layer)});
  if(pts.length)map.fitBounds(pts,{padding:[50,50],maxZoom:16});
  document.querySelectorAll('#days button').forEach((b,j)=>b.setAttribute('aria-pressed',j===d));
}
document.getElementById('days').innerHTML=DAYS.map((_,i)=>`<button type="button" data-d="${i}">${i+1}일차</button>`).join('');
document.getElementById('days').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)show(+b.dataset.d)});
show(1);
}
</script></body></html>
