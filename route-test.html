<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경로 지도 테스트</title>
<style>body{margin:0;padding:16px;font:15px/1.5 system-ui,sans-serif;background:#FFF4EC;color:#4A2D5E}h1{font-size:20px;margin:0 0 6px}p{margin:0 0 12px;font-size:13px}
.b{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.b button{flex:1;min-height:44px;border:0;border-radius:14px;background:#fff;font:inherit;font-weight:700;color:inherit;box-shadow:0 3px 0 #EAD2C6}.b button[aria-pressed=true]{background:#FF9C7E;color:#fff}
iframe{width:100%;height:460px;border:0;border-radius:18px;background:#eee}</style></head><body>
<h1>경로 지도 테스트</h1><p>하루 장소 전체가 구글지도 위에 경로로 이어져 보이는지 확인용이에요.</p>
<div class="b" id="d"></div><div class="b" id="m"></div>
<iframe id="f" title="경로 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>{const DAYS=[{"start": "10:30", "mode": "car", "fixEnd": true, "stops": [{"name": "고마쓰 공항 도착", "lat": 36.3946, "lng": 136.4065, "stay": 40, "cost": 0, "memo": "입국 심사·짐 찾기 시간 포함"}, {"name": "나타데라(那谷寺)", "lat": 36.3299, "lng": 136.4212, "stay": 90, "cost": 1000, "memo": "1월 1일이라 참배객이 많을 수 있음 · 입장료 확인 필요"}, {"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": "숙소가 정해지면 좌표를 바꿔 주세요"}]}, {"start": "09:00", "mode": "transit", "fixEnd": true, "stops": [{"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": ""}, {"name": "가나자와역", "lat": 36.5781, "lng": 136.6478, "stay": 15, "cost": 0, "memo": "고마쓰↔가나자와 기차표는 경비에 추가"}, {"name": "오미초 시장", "lat": 36.5716, "lng": 136.6566, "stay": 60, "cost": 3000, "memo": "정월 연휴 휴무 여부 확인 필요"}, {"name": "겐로쿠엔", "lat": 36.5621, "lng": 136.6627, "stay": 90, "cost": 320, "memo": "입장료 확인 필요"}, {"name": "가나자와 21세기 미술관", "lat": 36.561, "lng": 136.6583, "stay": 60, "cost": 0, "memo": "무료 구역 기준 · 연말연시 휴관 확인"}, {"name": "히가시차야 거리", "lat": 36.5725, "lng": 136.6668, "stay": 60, "cost": 0, "memo": ""}, {"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": ""}]}, {"start": "09:30", "mode": "car", "fixEnd": true, "stops": [{"name": "숙소 체크아웃", "lat": 36.4026, "lng": 136.4533, "stay": 30, "cost": 0, "memo": ""}, {"name": "고마쓰역 주변 점심", "lat": 36.4031, "lng": 136.4545, "stay": 60, "cost": 2500, "memo": ""}, {"name": "고마쓰 공항 출발", "lat": 36.3946, "lng": 136.4065, "stay": 0, "cost": 0, "memo": "보통 국제선은 2시간 전 도착 권장"}]}];let D=1,M='d';
const ll=s=>s.lat+','+s.lng;
function show(){const st=DAYS[D].stops.filter(s=>typeof s.lat==='number');const pts=[];st.forEach(s=>{const k=ll(s);if(pts[pts.length-1]!==k)pts.push(k)});
document.getElementById('f').src='https://maps.google.com/maps?saddr='+pts[0]+'&daddr='+pts.slice(1).join('+to:')+'&dirflg='+M+'&hl=ko&output=embed';
document.querySelectorAll('#d button').forEach((b,i)=>b.setAttribute('aria-pressed',i===D));document.querySelectorAll('#m button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===M))}
document.getElementById('d').innerHTML=DAYS.map((_,i)=>'<button data-d="'+i+'">'+(i+1)+'일차</button>').join('');
document.getElementById('m').innerHTML='<button data-m="d">자동차</button><button data-m="w">도보</button><button data-m="r">대중교통</button>';
document.getElementById('d').onclick=e=>{const b=e.target.closest('[data-d]');if(b){D=+b.dataset.d;show()}};
document.getElementById('m').onclick=e=>{const b=e.target.closest('[data-m]');if(b){M=b.dataset.m;show()}};show()}</script></body></html>
