<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경로 지도 테스트 2</title>
<style>body{margin:0;padding:14px;font:15px/1.5 system-ui,sans-serif;background:#FFF4EC;color:#4A2D5E}h1{font-size:19px;margin:0 0 4px}p{margin:0 0 10px;font-size:13px}
.b{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.b button{flex:1;min-height:42px;border:0;border-radius:12px;background:#fff;font:inherit;font-weight:700;color:inherit;box-shadow:0 3px 0 #EAD2C6}.b button[aria-pressed=true]{background:#FF9C7E;color:#fff}
iframe{width:100%;height:420px;border:0;border-radius:16px;background:#eee}code{font-size:11px;word-break:break-all;display:block;margin-top:8px;opacity:.6}</style></head><body>
<h1>경로 지도 테스트 2</h1><p>방식 1~4를 하나씩 눌러서, 날짜마다 경로 선이 그려지는 방식 번호를 알려 주세요.</p>
<div class="b" id="d"></div><div class="b" id="v"></div>
<iframe id="f" title="경로 지도" referrerpolicy="no-referrer-when-downgrade"></iframe><code id="u"></code>
<script>{const DAYS=[{"start": "10:30", "mode": "car", "fixEnd": true, "stops": [{"name": "고마쓰 공항 도착", "lat": 36.3946, "lng": 136.4065, "stay": 40, "cost": 0, "memo": "입국 심사·짐 찾기 시간 포함"}, {"name": "나타데라(那谷寺)", "lat": 36.3299, "lng": 136.4212, "stay": 90, "cost": 1000, "memo": "1월 1일이라 참배객이 많을 수 있음 · 입장료 확인 필요"}, {"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": "숙소가 정해지면 좌표를 바꿔 주세요"}]}, {"start": "09:00", "mode": "transit", "fixEnd": true, "stops": [{"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": ""}, {"name": "가나자와역", "lat": 36.5781, "lng": 136.6478, "stay": 15, "cost": 0, "memo": "고마쓰↔가나자와 기차표는 경비에 추가"}, {"name": "오미초 시장", "lat": 36.5716, "lng": 136.6566, "stay": 60, "cost": 3000, "memo": "정월 연휴 휴무 여부 확인 필요"}, {"name": "겐로쿠엔", "lat": 36.5621, "lng": 136.6627, "stay": 90, "cost": 320, "memo": "입장료 확인 필요"}, {"name": "가나자와 21세기 미술관", "lat": 36.561, "lng": 136.6583, "stay": 60, "cost": 0, "memo": "무료 구역 기준 · 연말연시 휴관 확인"}, {"name": "히가시차야 거리", "lat": 36.5725, "lng": 136.6668, "stay": 60, "cost": 0, "memo": ""}, {"name": "숙소 (미정 · 임시로 고마쓰역 위치)", "lat": 36.4026, "lng": 136.4533, "stay": 0, "cost": 0, "memo": ""}]}, {"start": "09:30", "mode": "car", "fixEnd": true, "stops": [{"name": "숙소 체크아웃", "lat": 36.4026, "lng": 136.4533, "stay": 30, "cost": 0, "memo": ""}, {"name": "고마쓰역 주변 점심", "lat": 36.4031, "lng": 136.4545, "stay": 60, "cost": 2500, "memo": ""}, {"name": "고마쓰 공항 출발", "lat": 36.3946, "lng": 136.4065, "stay": 0, "cost": 0, "memo": "보통 국제선은 2시간 전 도착 권장"}]}];let D=0,V=1;
const ll=s=>s.lat+','+s.lng;
function url(pts){const o=pts[0],dst=pts.slice(1);
 if(V===1)return'https://maps.google.com/maps?saddr='+o+'&daddr='+dst.join('+to:')+'&dirflg=d&hl=ko&output=embed';
 if(V===2)return'https://maps.google.com/maps?f=d&source=s_d&saddr='+o+'&daddr='+dst.join('+to:')+'&hl=ko&output=embed';
 if(V===3)return'https://www.google.com/maps?saddr='+o+'&daddr='+dst.map(encodeURIComponent).join('+to:')+'&dirflg=d&hl=ko&output=embed';
 return'https://maps.google.com/maps?saddr='+o+'&daddr='+dst[dst.length-1]+'&dirflg=d&hl=ko&output=embed'}
function show(){const pts=[];DAYS[D].stops.filter(s=>typeof s.lat==='number').forEach(s=>{const k=ll(s);if(pts[pts.length-1]!==k)pts.push(k)});const u=url(pts);document.getElementById('f').src=u;document.getElementById('u').textContent=u;
document.querySelectorAll('#d button').forEach((b,i)=>b.setAttribute('aria-pressed',i===D));document.querySelectorAll('#v button').forEach((b,i)=>b.setAttribute('aria-pressed',i+1===V))}
document.getElementById('d').innerHTML=DAYS.map((_,i)=>'<button data-d="'+i+'">'+(i+1)+'일차</button>').join('');
document.getElementById('v').innerHTML=[1,2,3,4].map(i=>'<button data-v="'+i+'">방식 '+i+'</button>').join('');
document.getElementById('d').onclick=e=>{const b=e.target.closest('[data-d]');if(b){D=+b.dataset.d;show()}};
document.getElementById('v').onclick=e=>{const b=e.target.closest('[data-v]');if(b){V=+b.dataset.v;show()}};show()}</script></body></html>
